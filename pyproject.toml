[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asdlc"
version = "0.2.0"
description = "ASDLC (AI-Software-Development-Life-Cycle) SDK: Enterprise AI Development Standardization & Quality Governance"
readme = "README.md"
authors = [{ name = "@sun-flat-yamada" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pyyaml>=6.0"
]

[project.scripts]
asdlc = "asdlc.cli.main:app"
